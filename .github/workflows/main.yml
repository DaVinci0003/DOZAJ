name: Build Dozaj Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Indir
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java (JDK 17) Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Onbellek Aktiflestir
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Paketleri Yukle ve Android Projesini Olustur
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Simetrik Dozaj Logosunu Sabitle
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          cp assets/dozaj-logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp assets/dozaj-logo.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/dozaj-logo.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/dozaj-logo.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/dozaj-logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/dozaj-logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp assets/dozaj-logo.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp assets/dozaj-logo.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp assets/dozaj-logo.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp assets/dozaj-logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

      - name: APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK Dosyasini Indirme Linki Olarak Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Dozaj-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
