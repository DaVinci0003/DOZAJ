name: Build Dozaj Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Indir
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java (JDK 17) Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Paketleri Yukle ve Android Projesini Olustur
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasini Indirme Linki Olarak Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Dozaj-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
