<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B1013" />
  <title>Dozaj</title>
  <style>
    :root {
      --bg-body: #080C0E;
      --bg-card: #0E1417;
      --bg-input: #0B1013;
      --bg-track: #1C252B;
      --border-subtle: #1D262C;
      --accent: #14E09B;
      --accent-hover: #10C487;
      --accent-text: #041A12;
      --text-primary: #F2F6F8;
      --text-secondary: #7C8B95;
      --text-muted: #55636C;
      --danger: #F87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-body);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 14px 40px;
      line-height: 1.4;
      overflow-x: hidden;
    }
    .splash-screen {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 45%, #111C21 0%, #080C0E 72%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.65s;
    }
    .splash-screen.hide { opacity: 0; transform: scale(1.04); visibility: hidden; pointer-events: none; }
    .splash-wordmark {
      font-size: 46px; font-weight: 900; letter-spacing: -1.5px; color: var(--accent);
      display: flex; align-items: baseline;
      text-shadow: 0 0 32px rgba(20, 224, 155, 0.28);
    }
    .app-shell { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; opacity: 0; transition: opacity 0.6s ease; }
    .app-shell.ready { opacity: 1; }
    .brand-logo { font-size: 20px; font-weight: 900; color: var(--accent); }
    .card { background-color: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 18px; }
  </style>
</head>
<body>
  <div class="splash-screen" id="splashScreen">
    <div class="splash-wordmark">Dozaj</div>
  </div>
  <div class="app-shell" id="appShell">
    <div class="brand-logo">Dozaj</div>
    <div class="card">
      <h2 style="color:var(--accent); font-size:16px; margin-bottom:8px;">Dozaj Kafein Takibi</h2>
      <p style="color:var(--text-secondary); font-size:13px;">Uygulama aktif ve simetrik logonuzla hazır!</p>
    </div>
  </div>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        document.getElementById("splashScreen").classList.add("hide");
        document.getElementById("appShell").classList.add("ready");
      }, 1000);
    });
  </script>
</body>
</html>
